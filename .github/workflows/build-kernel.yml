name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Demote non-Omnivision TPs to =m (keep TCM+I2C =y)
        run: |
          set -eux
          f=arch/arm64/configs/helix_defconfig
          sed -i \
            -e 's/^CONFIG_TOUCHSCREEN_HIMAX_CHIPSET=y$/CONFIG_TOUCHSCREEN_HIMAX_CHIPSET=m/' \
            -e 's/^CONFIG_TOUCHSCREEN_FTS=y$/CONFIG_TOUCHSCREEN_FTS=m/' \
            -e 's/^CONFIG_TOUCHSCREEN_FOCALTECH_SPI=y$/CONFIG_TOUCHSCREEN_FOCALTECH_SPI=m/' \
            -e 's/^CONFIG_TOUCHSCREEN_CHIPONE=y$/CONFIG_TOUCHSCREEN_CHIPONE=m/' \
            "$f"
          grep -E 'CONFIG_TOUCHSCREEN_(HIMAX_CHIPSET|OMNIVISION_TCM|OMNIVISION_TCM_I2C|FTS|FOCALTECH_SPI|CHIPONE)=' "$f"
          if ! git diff --quiet -- "$f"; then
            git config user.name Seuj09
            git config user.email '138261033+Seuj09@users.noreply.github.com'
            git add "$f"
            git commit -m 'helix: demote non-Omnivision TPs to =m (keep TCM+I2C =y)'
            git push origin HEAD:master || true
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc cpio libssl-dev xz-utils dwarves wget

      - name: Fetch AOSP Clang 12 (clang-r416183b)
        run: |
          mkdir -p clang
          wget -q -O clang-r416183b.tar.gz \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz'
          tar -xzf clang-r416183b.tar.gz -C clang
          rm -f clang-r416183b.tar.gz
          test -x clang/bin/clang
          clang/bin/clang --version | head -3

      - name: Build Image + modules (Jeus helix_defconfig + olddefconfig)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          make LLVM=1 LLVM_IAS=1 O="out" helix_defconfig
          make LLVM=1 LLVM_IAS=1 O="out" olddefconfig
          make LLVM=1 LLVM_IAS=1 O="out" -j$(nproc) Image modules

      - name: Compress Image with xz -9e and pack modules
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz
          mkdir -p out/modules_install
          export PATH="$PWD/clang/bin:$PATH"
          make LLVM=1 LLVM_IAS=1 O="out" INSTALL_MOD_PATH="$PWD/out/modules_install" modules_install
          tar -C out/modules_install -cJf out/modules.tar.xz .

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.xz
            out/modules.tar.xz
          if-no-files-found: error
