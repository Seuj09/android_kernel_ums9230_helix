name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves wget

      - name: Fetch AOSP Clang 12 (clang-r416183b)
        run: |
          mkdir -p clang
          wget -q -O clang-r416183b.tar.gz \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz'
          tar -xzf clang-r416183b.tar.gz -C clang
          rm -f clang-r416183b.tar.gz
          test -x clang/bin/clang
          clang/bin/clang --version | head -3

      - name: Build Image (Jeus helix_defconfig + olddefconfig)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          make LLVM=1 LLVM_IAS=1 O="out" helix_defconfig
          make LLVM=1 LLVM_IAS=1 O="out" olddefconfig
          make LLVM=1 LLVM_IAS=1 O="out" -j$(nproc) Image

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: error
