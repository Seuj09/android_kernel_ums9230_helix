name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            flex bison bc cpio libssl-dev xz-utils dwarves

      - name: Build Image (OEM GNU toolchain)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out sprd_qogirl6_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out -j$(nproc) Image

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: error
